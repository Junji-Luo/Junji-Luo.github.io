<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>毽球比赛抽签</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:"Microsoft YaHei",Arial,sans-serif}main{max-width:1100px;margin:auto;padding:35px 16px}.layout{display:grid;grid-template-columns:380px 1fr;gap:20px}.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 12px 30px #1f2d4e14}h1{font-size:40px;margin:0 0 8px}h2{margin:0}p{color:#6b7280;font-size:13px;line-height:1.6}label{display:block;font-weight:bold;font-size:13px;margin:15px 0 7px}textarea,input,select{width:100%;border:1px solid #e1e6ef;border-radius:10px;padding:10px;font:inherit;background:#fbfcfe}textarea{min-height:230px;resize:vertical;line-height:1.7}.mode{display:flex;gap:8px;align-items:center;margin:16px 0}.mode select{flex:1}.tier-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.plus-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.tier textarea,.plus textarea{min-height:120px}.tier-title{font-weight:bold;font-size:13px;margin-bottom:6px}.position-row{display:flex;gap:4px;margin-top:5px}.position-row input{padding:6px;font-size:12px}.position-row select{width:75px;padding:4px;font-size:12px}.actions{display:flex;gap:8px;margin-top:18px}button{border:0;border-radius:10px;padding:11px 16px;font-weight:bold;cursor:pointer}.primary{flex:1;background:#3563e9;color:#fff}.secondary{background:#edf0f5}.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.group{border:1px solid #e1e6ef;border-radius:14px;overflow:hidden}.group-head{padding:13px;background:#f3f6ff;display:flex;justify-content:space-between;font-weight:bold}ul{list-style:none;padding:8px 14px;margin:0}li{padding:8px 0;border-bottom:1px dashed #edf0f4;font-size:14px}li:last-child{border:0}.empty{min-height:350px;display:grid;place-items:center;color:#6b7280;border:1px dashed #d9deea;border-radius:14px}.notice{color:#d95353;min-height:18px;font-size:13px;margin-top:10px}[hidden]{display:none!important}@media(max-width:780px){.layout{grid-template-columns:1fr}.plus-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.tier-grid,.plus-grid{grid-template-columns:1fr}}</style></head><body><main><header><div style="color:#3563e9;font-weight:bold">DRAW SYSTEM FOR SHUTTLECOCK</div><h1>毽球比赛抽签</h1><p>请选择抽签模式并录入名单</p></header><section class="layout"><div class="card"><h2>随机抽签</h2><div class="mode"><label style="margin:0">抽签模式</label><select id="mode"><option value="normal">普通队伍分组</option><option value="tier">普通分档</option><option value="plus">Plus 分档</option></select></div><div id="normal"><label>队伍名单</label><textarea id="teams" placeholder="例如：&#10;一队&#10;二队&#10;三队"></textarea><label>分组数量</label><input id="groupCount" type="number" min="1" value="3"></div><div id="tier" hidden><label>各档次名单</label><div class="tier-grid"><div class="tier"><div class="tier-title">A档</div><textarea id="tierA"></textarea></div><div class="tier"><div class="tier-title">B档</div><textarea id="tierB"></textarea></div><div class="tier"><div class="tier-title">C档</div><textarea id="tierC"></textarea></div></div></div><div id="plus" hidden><label>Plus分档名单</label><div class="plus-grid"><div class="plus"><div class="tier-title">A档</div><textarea id="plusA"></textarea><div id="posA"></div></div><div class="plus"><div class="tier-title">A-档</div><textarea id="plusAm"></textarea><div id="posAm"></div></div><div class="plus"><div class="tier-title">B档</div><textarea id="plusB"></textarea><div id="posB"></div></div><div class="plus"><div class="tier-title">B-档</div><textarea id="plusBm"></textarea><div id="posBm"></div></div><div class="plus"><div class="tier-title">C档</div><textarea id="plusC"></textarea><div id="posC"></div></div></div><p>每个档次独立随机打乱，按 A+B-+C / A-+B+C 交替组合，站位会尽量按 1、2、3 号位均衡分配。</p></div><div id="notice" class="notice"></div><div class="actions"><button class="primary" id="draw">开始随机抽签</button><button class="secondary" id="clear">清空</button></div></div><div class="card"><h2>分组结果</h2><p id="summary">完成设置后点击开始抽签</p><div id="groups" class="empty">请先开始抽签</div></div></section></main><script>
const $=id=>document.getElementById(id),mode=$("mode"),normal=$("normal"),tier=$("tier"),plus=$("plus"),groups=$("groups"),notice=$("notice"),keys=["A","Am","B","Bm","C"];const list=v=>v.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),mix=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},esc=x=>x.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
keys.forEach(k=>$("plus"+k).oninput=()=>{let old=[...$("pos"+k).querySelectorAll('select')].map(x=>x.value),a=list($("plus"+k).value);$("pos"+k).innerHTML=a.map(x=>`<div class="position-row"><input readonly value="${esc(x)}"><select><option value="">&#x4E0D;&#x9650;&#x5236;</option><option value="1">1&#x53F7;&#x4F4D;</option><option value="2">2&#x53F7;&#x4F4D;</option><option value="3">3&#x53F7;&#x4F4D;</option></select></div>`).join('');[...$("pos"+k).querySelectorAll('select')].forEach((x,i)=>x.value=old[i]||'')});
function render(d){groups.className='groups';groups.innerHTML=d.map((a,i)=>`<article class="group"><div class="group-head"><span>&#x7B2C; ${i+1} &#x7EC4;</span><small>${a.length} &#x4EBA;</small></div><ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul></article>`).join('')}
function normalDraw(){let a=list($("teams").value),c=+$("groupCount").value;if(!a.length)throw "请输入名单";if(!c||c>a.length)throw "分组数量不能超过队伍总数";a=mix(a);let d=[],p=0;for(let i=0;i<c;i++){let n=Math.floor(a.length/c)+(i<a.length%c?1:0);d.push(a.slice(p,p+n).map(esc));p+=n}render(d)}function tierDraw(){let t=Object.fromEntries(["A","B","C"].map(k=>[k,mix(list($("tier"+k).value))])),g=Math.max(...Object.values(t).map(x=>x.length));if(!g)throw "请在普通分档名单中输入队伍";render(Array.from({length:g},(_,i)=>Object.entries(t).filter(([,x])=>x[i]).map(([k,x])=>k+"档："+esc(x[i]))))}function plusDraw(){let t=Object.fromEntries(keys.map(k=>[k,list($("plus"+k).value)])),q=Object.fromEntries(keys.map(k=>[k,mix(t[k].map((name,i)=>({name,pos:[...$("pos"+k).querySelectorAll('select')][i]?.value||'',key:k})))])),n=Object.values(t).reduce((a,x)=>a+x.length,0);if(!n)throw "请在 Plus 分档中输入人员";let x=Math.max(q.A.length,q.Bm.length),y=Math.max(q.Am.length,q.B.length),g=Math.max(x+y,q.C.length),pat=[];while(pat.length<g){if(pat.length%2===0&&x){pat.push('X');x--}else if(y){pat.push('Y');y--}else if(x){pat.push('X');x--}else pat.push('C')}let d=Array.from({length:g},()=>[]),take=(k,i)=>{let a=q[k],good=a.filter(v=>!d[i].some(z=>z.pos&&z.pos===v.pos)),v=(good.length?good:a).shift();if(v)d[i].push(v)};pat.forEach((v,i)=>{(v==='X'?["A","Bm"]:["Am","B"]).forEach(k=>take(k,i));take('C',i)});q&&keys.forEach(k=>q[k].forEach(v=>{let i=d.findIndex(a=>a.length<3);if(i<0){d.push([]);i=d.length-1}d[i].push(v)}));render(d.filter(a=>a.length).map(a=>a.map(v=>v.key+"档："+esc(v.name)+(v.pos?`（${v.pos}号位）`:''))))}
$("draw").onclick=()=>{notice.textContent='';try{mode.value==='normal'?normalDraw():mode.value==='tier'?tierDraw():plusDraw()}catch(e){notice.textContent=e.message}};mode.onchange=()=>{normal.hidden=mode.value!=='normal';tier.hidden=mode.value!=='tier';plus.hidden=mode.value!=='plus'};$("clear").onclick=()=>location.reload();mode.onchange();
</script></body></html>
