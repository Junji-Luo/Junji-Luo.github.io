<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>队伍抽签</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --ink: #172033;
      --muted: #6b7280;
      --line: #e6eaf0;
      --primary: #3563e9;
      --primary-dark: #274dcc;
      --soft: #eef3ff;
      --danger: #e05252;
      --shadow: 0 18px 45px rgba(31, 45, 78, .10);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(53,99,233,.12), transparent 28rem),
        radial-gradient(circle at 100% 20%, rgba(41,185,151,.09), transparent 25rem),
        var(--bg);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }
    .page { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 42px 0 56px; }
    header { margin-bottom: 26px; }
    .eyebrow { color: var(--primary); font-size: 13px; font-weight: 700; letter-spacing: .16em; margin-bottom: 9px; }
    h1 { margin: 0; font-size: clamp(30px, 4vw, 46px); line-height: 1.15; letter-spacing: -.03em; }
    .subtitle { color: var(--muted); margin: 12px 0 0; font-size: 15px; }
    .layout { display: grid; grid-template-columns: minmax(300px, 390px) 1fr; gap: 22px; align-items: start; }
    .card { background: rgba(255,255,255,.93); border: 1px solid rgba(230,234,240,.9); border-radius: 20px; box-shadow: var(--shadow); }
    .setup { padding: 24px; position: sticky; top: 20px; }
    .result { padding: 24px; min-height: 540px; }
    .section-title { margin: 0; font-size: 18px; }
    .section-desc { color: var(--muted); font-size: 13px; margin: 7px 0 20px; line-height: 1.6; }
    label { display: block; font-size: 13px; font-weight: 700; margin: 17px 0 8px; }
    textarea, input {
      width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 12px 13px;
      font: inherit; color: var(--ink); outline: none; background: #fbfcfe; transition: .2s;
    }
    textarea { min-height: 300px; resize: vertical; line-height: 1.75; }
    textarea:focus, input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(53,99,233,.11); background: #fff; }
    input[type=number] { width: 120px; }
    .row { display: flex; align-items: center; gap: 12px; }
    .hint { color: var(--muted); font-size: 12px; }
    .stats { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 8px; }
    .stats strong { color: var(--primary); }
    .actions { display: flex; gap: 10px; margin-top: 22px; }
    [hidden]{display:none!important}.mode-switch{display:flex;align-items:center;gap:12px;padding:13px 14px;margin:18px 0 4px;border:1px solid var(--line);border-radius:12px;background:#fbfcfe}.mode-name{color:var(--primary);font-size:12px;font-weight:700;margin-left:auto}.switch{position:relative;width:44px;height:24px;margin:0}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;cursor:pointer;border-radius:99px;background:#cbd2df;transition:.2s}.slider:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}.switch input:checked+.slider{background:var(--primary)}.switch input:checked+.slider:before{transform:translateX(20px)}.tier-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tier-box textarea{min-height:150px}.tier-title{font-size:13px;font-weight:800;margin-bottom:7px}.tier-title.a{color:#bd7b11}.tier-title.b{color:#3563e9}.tier-title.c{color:#18936e}.tier-tip{color:var(--muted);font-size:12px;line-height:1.5;margin-top:10px}@media(max-width:520px){.tier-grid{grid-template-columns:1fr}}
    button { border: 0; border-radius: 12px; padding: 12px 17px; font: inherit; font-weight: 700; cursor: pointer; transition: transform .15s, background .15s, box-shadow .15s; }
    button:hover { transform: translateY(-1px); }
    .primary { flex: 1; color: #fff; background: var(--primary); box-shadow: 0 8px 18px rgba(53,99,233,.25); }
    .primary:hover { background: var(--primary-dark); }
    .secondary { color: #405066; background: #edf0f5; }
    .secondary:hover { background: #e3e7ee; }
    .result-head { display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 20px; }
    .result-head p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .badge { color: var(--primary); background: var(--soft); border-radius: 99px; padding: 7px 11px; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
    .group { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: #fff; animation: rise .35s ease both; }
    .group-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: linear-gradient(135deg, #f3f6ff, #f9fbff); border-bottom: 1px solid var(--line); }
    .group-name { font-weight: 800; }
    .group-count { color: var(--muted); font-size: 12px; }
    ul { list-style: none; padding: 8px 16px 13px; margin: 0; }
    li { padding: 9px 0; border-bottom: 1px dashed #edf0f4; font-size: 14px; display: flex; gap: 9px; align-items: center; }
    li:last-child { border-bottom: 0; }
    .number { color: var(--primary); font-variant-numeric: tabular-nums; font-weight: 700; width: 20px; }
    .empty { min-height: 400px; display: grid; place-items: center; text-align: center; color: var(--muted); border: 1px dashed #d9deea; border-radius: 16px; background: #fbfcfe; padding: 30px; }
    .empty-icon { font-size: 42px; margin-bottom: 12px; }
    .notice { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 12px; }
    .footer-note { color: var(--muted); font-size: 12px; margin-top: 18px; text-align: center; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 780px) { .page { padding-top: 26px; } .layout { grid-template-columns: 1fr; } .setup { position: static; } textarea { min-height: 220px; } .result { min-height: auto; } }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="eyebrow">RANDOM DRAW</div>
      <h1>队伍抽签</h1>
      <p class="subtitle">录入队伍名称，设置分组数量，一键随机生成分组结果。</p>
    </header>

    <section class="layout">
      <div class="card setup">
        <h2 class="section-title">抽签设置</h2>
        <p class="section-desc">普通模式按队伍总数平均分组；开启分档后，会分别从 A、B、C 三个档次中独立随机抽取。</p>
        <div class="mode-switch"><span class="mode-switch-label">是否分档抽签</span><span class="mode-name" id="modeName">普通抽签</span><label class="switch"><input id="tierMode" type="checkbox"><span class="slider"></span></label></div>
        <div id="normalSettings">
          <label for="teams">队伍名单</label><textarea id="teams" placeholder="例如：&#10;一队&#10;二队&#10;三队"></textarea>
          <div class="stats"><span>当前队伍数：<strong id="teamCount">0</strong></span><span>支持重复抽签</span></div>
          <label for="groupCount">分组数量</label><div class="row"><input id="groupCount" type="number" min="1" value="3"><span class="hint" id="distributionHint">请输入队伍后查看分配情况</span></div>
        </div>
        <div id="tierSettings" hidden><label>各档次名单</label><div class="tier-grid">
          <div class="tier-box"><div class="tier-title a">A 档</div><textarea id="tierA" placeholder="例如：&#10;A1&#10;A2"></textarea></div>
          <div class="tier-box"><div class="tier-title b">B 档</div><textarea id="tierB" placeholder="例如：&#10;B1&#10;B2"></textarea></div>
          <div class="tier-box"><div class="tier-title c">C 档</div><textarea id="tierC" placeholder="例如：&#10;C1&#10;C2"></textarea></div></div>
          <div class="stats"><span>总人数：<strong id="tierTeamCount">0</strong></span><span id="tierGroupHint">组数按人数最多的档次确定</span></div>
        </div>
        <div class="notice" id="notice"></div>
        <div class="actions">
          <button class="primary" id="drawBtn">开始随机抽签</button>
          <button class="secondary" id="clearBtn">清空</button>
        </div>
        <p class="footer-note">名单会自动保存在当前浏览器中，仅保存在本机。</p>
      </div>

      <div class="card result">
        <div class="result-head">
          <div><h2 class="section-title">分组结果</h2><p id="resultSummary">完成设置后，点击“开始随机抽签”</p></div>
          <span class="badge" id="resultBadge">等待抽签</span>
        </div>
        <div id="groups" class="empty">
          <div><div class="empty-icon">🎲</div><div>随机打乱队伍后，<br />分组结果会显示在这里</div></div>
        </div>
      </div>
    </section>
  </main>

  <script>
const teamsInput=document.getElementById('teams'),groupInput=document.getElementById('groupCount'),tierMode=document.getElementById('tierMode'),normalSettings=document.getElementById('normalSettings'),tierSettings=document.getElementById('tierSettings'),modeName=document.getElementById('modeName'),tierInputs={A:document.getElementById('tierA'),B:document.getElementById('tierB'),C:document.getElementById('tierC')},notice=document.getElementById('notice'),groups=document.getElementById('groups'),summary=document.getElementById('resultSummary'),badge=document.getElementById('resultBadge'),storageKey='simple-team-draw-data';
const names=v=>v.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},esc=x=>x.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),save=()=>localStorage.setItem(storageKey,JSON.stringify({teams:teamsInput.value,groupCount:groupInput.value,tierMode:tierMode.checked,tierA:tierInputs.A.value,tierB:tierInputs.B.value,tierC:tierInputs.C.value}));
const render=(data,text)=>{groups.className='groups';groups.innerHTML=data.map((m,i)=>`<article class="group"><div class="group-head"><span class="group-name">第 ${i+1} 组</span><span class="group-count">${m.length}</span></div><ul>${m.map((x,j)=>`<li><span class="number">${j+1}</span><span>${x}</span></li>`).join('')}</ul></article>`).join('');summary.textContent=text;badge.textContent='抽签完成'};
    const update=()=>{if(tierMode.checked){let t=Object.fromEntries(Object.entries(tierInputs).map(([k,v])=>[k,names(v.value)])),n=Object.values(t).reduce((a,x)=>a+x.length,0),max=Math.max(...Object.values(t).map(x=>x.length));document.getElementById('tierTeamCount').textContent=n;document.getElementById('tierGroupHint').textContent=max?`将生成 ${max} 组`:`组数按人数最多的档次确定`}else{let n=names(teamsInput.value).length;document.getElementById('teamCount').textContent=n;document.getElementById('distributionHint').textContent=n?`当前共 ${n} 支队伍`:`请输入队伍后查看分配情况`}save();};
const draw=()=>{notice.textContent='';if(tierMode.checked){let t=Object.fromEntries(Object.entries(tierInputs).map(([k,v])=>[k,shuffle(names(v.value))])),n=Object.values(t).reduce((a,x)=>a+x.length,0),g=Math.max(...Object.values(t).map(x=>x.length));if(!n){notice.textContent='请至少在 A、B、C 任一档次中输入队伍。';return}let d=Array.from({length:g},(_,i)=>Object.entries(t).filter(([,x])=>x[i]).map(([k,x])=>k+'档：'+esc(x[i])));render(d,'共'+n+'人，分档随机分为'+g+'组')}else{let a=names(teamsInput.value),c=+groupInput.value;if(!a.length){notice.textContent='请至少输入 1 支队伍。';return}if(!c||c>a.length){notice.textContent='分组数量必须不超过队伍总数。';return}let q=shuffle(a),base=Math.floor(a.length/c),extra=a.length%c,d=[],p=0;for(let i=0;i<c;i++){let z=base+(i<extra?1:0);d.push(q.slice(p,p+z).map(esc));p+=z}render(d,'共'+a.length+'支队伍，随机分为'+c+'组')}};
tierMode.onchange=()=>{normalSettings.hidden=tierMode.checked;tierSettings.hidden=!tierMode.checked;modeName.textContent=tierMode.checked?'分档抽签':'普通抽签';update()};document.getElementById('drawBtn').onclick=draw;document.getElementById('clearBtn').onclick=()=>{teamsInput.value='';groupInput.value=3;Object.values(tierInputs).forEach(x=>x.value='');tierMode.checked=false;normalSettings.hidden=false;tierSettings.hidden=true;modeName.textContent='普通抽签';groups.className='empty';groups.innerHTML='<div><div class="empty-icon">&#x1F3B2;</div><div>随机打乱队伍后，<br />分组结果会显示在这里</div></div>';summary.textContent='完成设置后，点击“开始随机抽签”';badge.textContent='等待抽签';update()};[teamsInput,groupInput,...Object.values(tierInputs)].forEach(x=>x.oninput=update);let saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(saved){teamsInput.value=saved.teams||'';groupInput.value=saved.groupCount||3;tierMode.checked=!!saved.tierMode;tierInputs.A.value=saved.tierA||'';tierInputs.B.value=saved.tierB||'';tierInputs.C.value=saved.tierC||''}normalSettings.hidden=tierMode.checked;tierSettings.hidden=!tierMode.checked;modeName.textContent=tierMode.checked?'分档抽签':'普通抽签';update();
  </script>
</body>
</html>
